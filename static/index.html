<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 16px; }

    /* Título con el autor al lado, en letra muy pequeña */
    .encabezado { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-bottom: 12px; }
    .encabezado h2 { margin: 0; font-size: clamp(20px, 5vw, 28px); }
    .autor { color: #666; font-size: 10px; }

    /* Computador: chat a la izquierda y leyenda a la derecha */
    .contenedor { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
    #chat { border: 1px solid #ccc; border-radius: 8px; height: 60vh; min-height: 280px; overflow-y: auto; padding: 12px; overflow-wrap: anywhere; }
    .mensaje { margin: 8px 0; }
    .usuario { text-align: right; color: #0a58ca; }
    canvas { max-width: 100%; }

    form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    input[type=text] { flex: 1 1 200px; min-width: 0; padding: 12px; font-size: 16px; }
    button { padding: 12px 16px; font-size: 15px; cursor: pointer; }

    #leyenda { border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
    #leyenda h3 { margin: 0 0 8px; }
    #leyenda h4 { margin: 14px 0 6px; font-size: 14px; }
    .pregunta { display: block; width: 100%; text-align: left; margin-bottom: 6px; padding: 10px; font-size: 14px; }

    /* Tableta y celular: todo en una columna */
    @media (max-width: 800px) {
      .contenedor { grid-template-columns: 1fr; }
      #chat { height: 50vh; }
    }
    /* Celular pequeño: los botones se reparten el ancho */
    @media (max-width: 480px) {
      body { padding: 10px; }
      form button { flex: 1; }
    }
  </style>
</head>
<body>
  <header class="encabezado">
    <h2 id="titulo"></h2>
    <span class="autor">Elaborado por: RoomiesIQ</span>
  </header>

  <div class="contenedor">
    <main>
      <div id="chat"></div>
      <form id="formulario">
        <input type="text" id="texto" autocomplete="off" placeholder="Escribe o pulsa Hablar">
        <button type="button" id="boton-hablar">Hablar</button>
        <button>Enviar</button>
      </form>
      <label><input type="checkbox" id="casilla-voz" checked> Respuesta en voz</label>
      <span id="estado"></span>
    </main>
    <aside id="leyenda"></aside>
  </div>

  <script>
    // ===== HAMP EXPLICA: LO ÚNICO QUE CAMBIA ENTRE PROYECTOS =====
   const TITULO = "Agente de Roomies";
const PREGUNTAS = {
  "Consultas": [
    "¿Cuántas habitaciones están disponibles?",
    "Muéstrame la lista de habitaciones disponibles.",
    "¿Qué habitaciones hay cerca de universidades?",
    "¿Qué servicios y reglas tienen las habitaciones disponibles?",
    "¿Qué reservas hay registradas actualmente?",
 ],
  "Gráficos": [
    "Grafica los ingresos por método de pago.",
    "Hazme un gráfico de torta de las reservas por distrito."
  ],
  "Registros": [
    "Quiero reservar una habitación."
  ]
};
    // ===============================================

    const cajaChat = document.getElementById("chat");
    const cajaTexto = document.getElementById("texto");
    const formulario = document.getElementById("formulario");
    const botonHablar = document.getElementById("boton-hablar");
    const casillaVoz = document.getElementById("casilla-voz");
    const mensajeEstado = document.getElementById("estado");
    const leyenda = document.getElementById("leyenda");

    document.title = TITULO;
    document.getElementById("titulo").textContent = TITULO;

    // Leyenda: una lista de botones; al pulsar uno se envía la pregunta
    leyenda.innerHTML = "<h3>Preguntas para probar</h3>";
    for (const grupo in PREGUNTAS) {
      const subtitulo = document.createElement("h4");
      subtitulo.textContent = grupo;
      leyenda.appendChild(subtitulo);

      for (const pregunta of PREGUNTAS[grupo]) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "pregunta";
        boton.textContent = pregunta;
        boton.onclick = () => enviar(pregunta);
        leyenda.appendChild(boton);
      }
    }

    // Agrega un mensaje al chat
    function agregarMensaje(texto, clase) {
      const mensaje = document.createElement("div");
      mensaje.className = "mensaje " + clase;
      mensaje.textContent = texto;
      cajaChat.appendChild(mensaje);
      cajaChat.scrollTop = cajaChat.scrollHeight;
      return mensaje;
    }

    // Dibuja un gráfico con Chart.js
    function dibujarGrafico(grafico) {
      const lienzo = document.createElement("canvas");
      lienzo.style.maxHeight = "280px";
      cajaChat.appendChild(lienzo);
      new Chart(lienzo, {
        type: grafico.tipo,
        data: { labels: grafico.etiquetas, datasets: [{ label: grafico.titulo, data: grafico.valores }] },
        options: { plugins: { title: { display: true, text: grafico.titulo } } }
      });
      cajaChat.scrollTop = cajaChat.scrollHeight;
    }

    // Envía la pregunta al servidor (POST /chat) y muestra la respuesta
    async function enviar(texto) {
      texto = texto.trim();
      if (!texto) return;

      agregarMensaje(texto, "usuario");
      const mensajeEspera = agregarMensaje("...", "agente");
      try {
        const respuestaHttp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto })
        });
        const datos = await respuestaHttp.json();
        mensajeEspera.textContent = datos.respuesta || "(sin respuesta)";
        if (datos.grafico) dibujarGrafico(datos.grafico);
        leerEnVoz(datos.respuesta);
      } catch (error) {
        mensajeEspera.textContent = "Error: " + error;
      }
    }

    // Al enviar el formulario
    formulario.onsubmit = (evento) => {
      evento.preventDefault();
      enviar(cajaTexto.value);
      cajaTexto.value = "";
    };

    // Voz -> texto (solo en Edge, Chrome y Safari)
    const ReconocimientoDeVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!ReconocimientoDeVoz) {
      botonHablar.disabled = true;
      mensajeEstado.textContent = " Este navegador no permite voz.";
    } else {
      const reconocedor = new ReconocimientoDeVoz();
      reconocedor.lang = "es-PE";
      reconocedor.onresult = (resultado) => enviar(resultado.results[0][0].transcript);
      reconocedor.onend = () => { mensajeEstado.textContent = ""; };
      reconocedor.onerror = (error) => { mensajeEstado.textContent = " Micrófono: " + error.error; };
      botonHablar.onclick = () => {
        mensajeEstado.textContent = " Escuchando...";
        reconocedor.start();
      };
    }

    // Texto -> voz: lee la respuesta en voz alta
    function leerEnVoz(texto) {
      if (!casillaVoz.checked || !texto) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(texto));
    }
  </script>
</body>
</html>
